<!DOCTYPE html>
<html>
<head>
    <title>Banglore Home Price Prediction</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="app.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="page-wrapper">

    <header class="header">
        <div class="header-tag">ML Powered</div>
        <h1 class="header-title">Bangalore<br><span>Home Prices</span></h1>
        <p class="header-sub">Enter property details to get an instant AI-powered estimate</p>
    </header>

    <div class="card">

        <div class="field-group">
            <label class="field-label">
                <span class="label-num">01</span>
                Area (Square Feet)
            </label>
            <div class="input-wrap">
                <input class="area" type="number" id="uiSqft" name="Squareft" value="1000" placeholder="e.g. 1200">
                <span class="input-unit">sq.ft</span>
            </div>
        </div>

        <div class="field-group">
            <label class="field-label">
                <span class="label-num">02</span>
                BHK
            </label>
            <div class="switch-field" id="bhk-group">
                <input type="radio" id="radio-bhk-1" name="uiBHK" value="1"/>
                <label for="radio-bhk-1">1</label>
                <input type="radio" id="radio-bhk-2" name="uiBHK" value="2" checked/>
                <label for="radio-bhk-2">2</label>
                <input type="radio" id="radio-bhk-3" name="uiBHK" value="3"/>
                <label for="radio-bhk-3">3</label>
                <input type="radio" id="radio-bhk-4" name="uiBHK" value="4"/>
                <label for="radio-bhk-4">4</label>
                <input type="radio" id="radio-bhk-5" name="uiBHK" value="5"/>
                <label for="radio-bhk-5">5</label>
            </div>
        </div>

        <div class="field-group">
            <label class="field-label">
                <span class="label-num">03</span>
                Bathrooms
            </label>
            <div class="switch-field" id="bath-group">
                <input type="radio" id="radio-bath-1" name="uiBathrooms" value="1"/>
                <label for="radio-bath-1">1</label>
                <input type="radio" id="radio-bath-2" name="uiBathrooms" value="2" checked/>
                <label for="radio-bath-2">2</label>
                <input type="radio" id="radio-bath-3" name="uiBathrooms" value="3"/>
                <label for="radio-bath-3">3</label>
                <input type="radio" id="radio-bath-4" name="uiBathrooms" value="4"/>
                <label for="radio-bath-4">4</label>
                <input type="radio" id="radio-bath-5" name="uiBathrooms" value="5"/>
                <label for="radio-bath-5">5</label>
            </div>
        </div>

        <div class="field-group">
            <label class="field-label">
                <span class="label-num">04</span>
                Location
            </label>
            <div class="select-wrap">
                <select class="location" name="" id="uiLocations">
                    <option value="" disabled="disabled" selected="selected">Choose a Location</option>
                    <option>Electronic City</option>
                    <option>Rajaji Nagar</option>
                </select>
                <span class="select-arrow">↓</span>
            </div>
        </div>

        <button class="submit" onclick="onClickedEstimatePrice()" type="button">
            <span class="btn-text">Estimate Price</span>
            <span class="btn-icon">→</span>
        </button>

        <div id="uiEstimatedPrice" class="result">
            <h2></h2>
        </div>

    </div>

    <footer class="footer">Powered by Linear Regression · Bangalore Real Estate Dataset</footer>

</div>

</body>
</html>
